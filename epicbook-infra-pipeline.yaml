trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: epicbook-agent-pool

variables:
  - group: Epicbook-mysql-secrets

  - name: terraformVersion
    value: '1.15.7'

  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)'

stages:

# ============================================================
# 1. TERRAFORM FORMAT
# ============================================================

- stage: TerraformFmt
  displayName: 'Terraform Format'

  jobs:
  - job: Fmt
    displayName: 'Terraform Format Check'

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - bash: |
        set -e

        TERRAFORM_VERSION="$(terraformVersion)"

        echo "Checking Terraform installation..."

        if command -v terraform >/dev/null 2>&1; then

          echo "Terraform is already installed:"
          terraform version

        else

          echo "Terraform is not installed."
          echo "Installing Terraform ${TERRAFORM_VERSION}..."

          wget -q \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

          unzip -o \
            "terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

          sudo mv terraform /usr/local/bin/terraform

          rm \
            "terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

          echo "Terraform installation completed."

          terraform version

        fi

      displayName: 'Install Terraform'

    # --------------------------------------------------------
    # Terraform Format
    # --------------------------------------------------------

    - bash: |
        cd "$(workingDirectory)"

        terraform fmt -check -recursive

      displayName: 'Terraform Format Check'


# ============================================================
# 2. TERRAFORM INIT
# ============================================================

- stage: TerraformInit
  displayName: 'Terraform Init'

  dependsOn: TerraformFmt
  condition: succeeded()

  jobs:
  - job: Init
    displayName: 'Initialize Terraform'

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - bash: |
        set -e

        TERRAFORM_VERSION="$(terraformVersion)"

        echo "Checking Terraform installation..."

        if command -v terraform >/dev/null 2>&1; then

          echo "Terraform is already installed:"
          terraform version

        else

          echo "Installing Terraform ${TERRAFORM_VERSION}..."

          wget -q \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

          unzip -o \
            "terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

          sudo mv terraform /usr/local/bin/terraform

          rm \
            "terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

          terraform version

        fi

      displayName: 'Install Terraform'

    # --------------------------------------------------------
    # Download SSH Private Key
    # --------------------------------------------------------

    - task: DownloadSecureFile@1
      name: sshKey
      displayName: 'Download SSH Private Key'

      inputs:
        secureFile: 'id_ed25519'

    # --------------------------------------------------------
    # Prepare SSH Key
    # --------------------------------------------------------

    - bash: |
        chmod 600 "$(sshKey.secureFilePath)"

        echo "SSH private key prepared."

      displayName: 'Prepare SSH Private Key'

    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Init'

      inputs:
        azureSubscription: 'azure-epicbook-connection'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(workingDirectory)'

        inlineScript: |

          set -e

          echo "Checking Azure authentication..."

          az account show

          echo ""
          echo "Initializing Terraform..."

          terraform init \
            -input=false \
            -reconfigure

          echo ""
          echo "Terraform initialization completed."


# ============================================================
# 3. TERRAFORM VALIDATE
# ============================================================

- stage: TerraformValidate
  displayName: 'Terraform Validate'

  dependsOn: TerraformInit
  condition: succeeded()

  jobs:
  - job: Validate
    displayName: 'Validate Terraform'

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - bash: |
        set -e

        TERRAFORM_VERSION="$(terraformVersion)"

        echo "Checking Terraform installation..."

        if command -v terraform >/dev/null 2>&1; then

          echo "Terraform is already installed:"
          terraform version

        else

          echo "Installing Terraform ${TERRAFORM_VERSION}..."

          wget -q \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

          unzip -o \
            "terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

          sudo mv terraform /usr/local/bin/terraform

          rm \
            "terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

          terraform version

        fi

      displayName: 'Install Terraform'

    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Init'

      inputs:
        azureSubscription: 'azure-epicbook-connection'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(workingDirectory)'

        inlineScript: |

          set -e

          echo "Initializing Terraform..."

          terraform init \
            -input=false \
            -reconfigure

    # --------------------------------------------------------
    # Terraform Validate
    # --------------------------------------------------------

    - bash: |

        set -e

        cd "$(workingDirectory)"

        echo "Validating Terraform configuration..."

        terraform validate

        echo ""
        echo "Terraform validation completed successfully."

      displayName: 'Terraform Validate'


# ============================================================
# 4. TERRAFORM PLAN
# ============================================================

- stage: TerraformPlan
  displayName: 'Terraform Plan'

  dependsOn: TerraformValidate
  condition: succeeded()

  jobs:
  - job: Plan
    displayName: 'Create Terraform Plan'

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - bash: |
        set -e

        TERRAFORM_VERSION="$(terraformVersion)"

        echo "Checking Terraform installation..."

        if command -v terraform >/dev/null 2>&1; then

          echo "Terraform is already installed:"
          terraform version

        else

          echo "Installing Terraform ${TERRAFORM_VERSION}..."

          wget -q \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

          unzip -o \
            "terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

          sudo mv terraform /usr/local/bin/terraform

          rm \
            "terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

          terraform version

        fi

      displayName: 'Install Terraform'

    # --------------------------------------------------------
    # Download SSH Private Key
    # --------------------------------------------------------

    - task: DownloadSecureFile@1
      name: sshKey
      displayName: 'Download SSH Private Key'

      inputs:
        secureFile: 'id_ed25519'

    # --------------------------------------------------------
    # Prepare SSH Key
    # --------------------------------------------------------

    - bash: |

        chmod 600 "$(sshKey.secureFilePath)"

        echo "SSH private key prepared."

      displayName: 'Prepare SSH Key'

    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Init'

      inputs:
        azureSubscription: 'azure-epicbook-connection'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(workingDirectory)'

        inlineScript: |

          set -e

          echo "Initializing Terraform..."

          terraform init \
            -input=false \
            -reconfigure

    # --------------------------------------------------------
    # Terraform Plan
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Plan'

      inputs:
        azureSubscription: 'azure-epicbook-connection'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(workingDirectory)'

        inlineScript: |

          set -e

          echo "Creating Terraform execution plan..."

          terraform plan \
            -input=false \
            -out=tfplan

          echo ""
          echo "Terraform plan created successfully."

      env:
        TF_VAR_db_admin_username: $(mysqlAdminUsername)
        TF_VAR_db_admin_password: $(mysqlAdminPassword)

    # --------------------------------------------------------
    # Publish Terraform Plan
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'

      inputs:
        targetPath: '$(workingDirectory)/tfplan'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'


# ============================================================
# 5. TERRAFORM APPLY
# ============================================================

- stage: TerraformApply
  displayName: 'Terraform Apply'

  dependsOn: TerraformPlan
  condition: succeeded()

  jobs:

  - deployment: Apply
    displayName: 'Apply Terraform Infrastructure'

    # --------------------------------------------------------
    # Azure DevOps Environment
    #
    # Configure approval on this environment:
    #
    # Pipelines
    #   -> Environments
    #      -> epicbook-production
    #         -> Approvals and checks
    #            -> Approvals
    #
    # --------------------------------------------------------

    environment: 'epicbook-production'

    strategy:
      runOnce:

        deploy:

          steps:

          - checkout: self

          # --------------------------------------------------
          # Install Terraform
          # --------------------------------------------------

          - bash: |
              set -e

              TERRAFORM_VERSION="$(terraformVersion)"

              echo "Checking Terraform installation..."

              if command -v terraform >/dev/null 2>&1; then

                echo "Terraform is already installed:"
                terraform version

              else

                echo "Installing Terraform ${TERRAFORM_VERSION}..."

                wget -q \
                  "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

                unzip -o \
                  "terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

                sudo mv terraform /usr/local/bin/terraform

                rm \
                  "terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

                terraform version

              fi

            displayName: 'Install Terraform'

          # --------------------------------------------------
          # Download SSH Private Key
          # --------------------------------------------------

          - task: DownloadSecureFile@1
            name: sshKey
            displayName: 'Download SSH Private Key'

            inputs:
              secureFile: 'id_ed25519'

          # --------------------------------------------------
          # Prepare SSH Key
          # --------------------------------------------------

          - bash: |

              chmod 600 "$(sshKey.secureFilePath)"

              echo "SSH private key prepared."

            displayName: 'Prepare SSH Key'

          # --------------------------------------------------
          # Terraform Init
          # --------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Terraform Init'

            inputs:
              azureSubscription: 'azure-epicbook-connection'
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: '$(workingDirectory)'

              inlineScript: |

                set -e

                echo "Checking Azure authentication..."

                az account show

                echo ""
                echo "Initializing Terraform..."

                terraform init \
                  -input=false \
                  -reconfigure

          # --------------------------------------------------
          # Download Terraform Plan
          # --------------------------------------------------

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'

            inputs:
              artifact: 'terraform-plan'
              path: '$(workingDirectory)'

          # --------------------------------------------------
          # Verify Plan File
          # --------------------------------------------------

          - bash: |

              set -e

              cd "$(workingDirectory)"

              echo "Checking Terraform plan..."

              if [ ! -f "tfplan" ]; then

                echo "ERROR: tfplan was not found."

                exit 1

              fi

              ls -lh tfplan

              echo "Terraform plan found."

            displayName: 'Verify Terraform Plan'

          # --------------------------------------------------
          # Terraform Apply
          # --------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Terraform Apply'

            inputs:
              azureSubscription: 'azure-epicbook-connection'
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: '$(workingDirectory)'

              inlineScript: |

                set -e

                echo "Applying Terraform infrastructure..."

                terraform apply \
                  -input=false \
                  tfplan

                echo ""
                echo "Terraform apply completed successfully."

            env:
              TF_VAR_db_admin_username: $(mysqlAdminUsername)
              TF_VAR_db_admin_password: $(mysqlAdminPassword)

          # --------------------------------------------------
          # Terraform Outputs
          # --------------------------------------------------

          - task: AzureCLI@2
            displayName: 'Terraform Outputs'

            inputs:
              azureSubscription: 'azure-epicbook-connection'
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: '$(workingDirectory)'

              inlineScript: |

                set -e

                echo "=========================================="
                echo "Terraform Deployment Outputs"
                echo "=========================================="

                terraform output

                echo "=========================================="
                echo "Deployment completed."
                echo "=========================================="